services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://nexussaas:nexussaas@db:5432/nexussaas
      - REDIS_URL=redis://redis:6379
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nexussaas
      POSTGRES_PASSWORD: nexussaas
      POSTGRES_DB: nexussaas
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
volumes:
  pgdata:

# Dev stack. Ports are bound to localhost only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nexussaas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexussaas}
      POSTGRES_DB: nexussaas
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexussaas"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nexusminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nexusminio-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    profiles: ["s3"]
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  miniodata:

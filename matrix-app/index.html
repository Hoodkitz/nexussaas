<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusSaaS — Matrix Blueprint</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
#matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
.container { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
.screen { display: none; width: 100%; max-width: 600px; text-align: center; }
.screen.active { display: block; }
h1 { font-size: 2.5rem; text-shadow: 0 0 10px #0f0; margin-bottom: 20px; }
h2 { font-size: 1.5rem; margin-bottom: 15px; text-shadow: 0 0 5px #0f0; }
.question { font-size: 1.3rem; margin-bottom: 20px; padding: 20px; border: 1px solid #0f0; border-radius: 5px; background: rgba(0,20,0,0.8); }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.option { padding: 15px; border: 1px solid #0f0; border-radius: 5px; cursor: pointer; background: rgba(0,30,0,0.5); transition: all 0.3s; text-align: left; }
.option:hover { background: rgba(0,80,0,0.8); box-shadow: 0 0 10px #0f0; }
.option.selected { background: rgba(0,120,0,0.9); box-shadow: 0 0 15px #0f0; }
.option .label { font-weight: bold; }
.option .desc { font-size: 0.85rem; color: #0a0; margin-top: 5px; }
.input-field { width: 100%; padding: 15px; background: rgba(0,20,0,0.8); border: 1px solid #0f0; color: #0f0; font-family: inherit; font-size: 1rem; border-radius: 5px; margin-bottom: 20px; }
.input-field:focus { outline: none; box-shadow: 0 0 10px #0f0; }
.btn { padding: 15px 30px; background: #0f0; color: #000; border: none; border-radius: 5px; font-family: inherit; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
.btn:hover { background: #0a0; box-shadow: 0 0 15px #0f0; }
.btn:disabled { background: #050; color: #030; cursor: not-allowed; }
.progress-bar { width: 100%; height: 5px; background: #030; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
.progress-fill { height: 100%; background: #0f0; width: 0%; transition: width 0.5s; box-shadow: 0 0 10px #0f0; }
.loading-text { font-size: 1.2rem; margin-top: 20px; }
.project-card { border: 1px solid #0f0; border-radius: 5px; padding: 20px; margin: 10px 0; background: rgba(0,20,0,0.8); text-align: left; }
.project-card h3 { color: #0f0; margin-bottom: 10px; }
.project-card p { color: #0a0; font-size: 0.9rem; margin-bottom: 10px; }
.download-btn { display: inline-block; padding: 10px 20px; background: #0f0; color: #000; text-decoration: none; border-radius: 5px; font-weight: bold; }
.download-btn:hover { background: #0a0; }
.hint { font-size: 0.85rem; color: #0a0; margin-bottom: 15px; font-style: italic; }
.ai-research { background: rgba(0,40,0,0.6); border: 1px solid #0a0; border-radius: 5px; padding: 15px; margin: 15px 0; font-size: 0.9rem; color: #0a0; display: none; text-align: left; }
.ai-research.active { display: block; }
.ai-research h4 { color: #0f0; margin-bottom: 8px; }
.ai-research .research-item { margin: 5px 0; padding-left: 10px; border-left: 2px solid #0a0; }
.ai-analyzing { color: #0f0; font-style: italic; animation: blink 1s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.chat-btn { display: inline-block; padding: 10px 20px; background: #003300; color: #0f0; border: 1px solid #0f0; border-radius: 5px; font-weight: bold; cursor: pointer; margin-left: 10px; }
.chat-btn:hover { background: #006600; box-shadow: 0 0 10px #0f0; }
.chat-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
.chat-overlay.active { display: flex; }
.chat-window { width: 90%; max-width: 500px; height: 70%; background: #001100; border: 1px solid #0f0; border-radius: 10px; display: flex; flex-direction: column; }
.chat-header { padding: 15px; border-bottom: 1px solid #0f0; display: flex; justify-content: space-between; align-items: center; }
.chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
.chat-msg { margin-bottom: 10px; padding: 10px; border-radius: 5px; max-width: 85%; }
.chat-msg.ai { background: rgba(0,50,0,0.5); border: 1px solid #0a0; }
.chat-msg.user { background: rgba(0,100,0,0.5); border: 1px solid #0f0; margin-left: auto; }
.chat-input-area { padding: 15px; border-top: 1px solid #0f0; display: flex; gap: 10px; }
.chat-input-area input { flex: 1; }
</style>
</head>
<body>
<canvas id="matrix-bg"></canvas>
<div class="container">
  <div id="start-screen" class="screen active">
    <h1>NEXUSSAAS</h1>
    <p style="margin-bottom:30px; color:#0a0;">KI-gestützter Blueprint Generator</p>
    <button class="btn" onclick="startBlueprint()">START</button>
  </div>

  <div id="question-screen" class="screen">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="question" id="question-text"></div>
    <div class="hint" id="question-hint"></div>
    <div class="options" id="options-container"></div>
    <input type="text" class="input-field" id="answer-input" placeholder="Deine Antwort...">
    <div class="ai-research" id="ai-research">
      <h4>🤖 KI-ANALYSE</h4>
      <div id="research-content"></div>
    </div>
    <button class="btn" id="next-btn" onclick="submitAnswer()" disabled>WEITER</button>
  </div>

  <div id="loading-screen" class="screen">
    <h2>ERSTELLE APP...</h2>
    <div class="progress-bar"><div class="progress-fill" id="loading-progress"></div></div>
    <div class="loading-text" id="loading-text">Initialisiere...</div>
  </div>

  <div id="projects-screen" class="screen">
    <h1>PROJEKTE</h1>
    <div id="projects-list"></div>
    <button class="btn" style="margin-top:20px;" onclick="restart()">NEUES PROJEKT</button>
  </div>
</div>

<div class="chat-overlay" id="chat-overlay">
  <div class="chat-window">
    <div class="chat-header">
      <span>AI Chat — <span id="chat-project-name"></span></span>
      <button class="btn" style="padding:5px 15px; font-size:0.9rem;" onclick="closeChat()">X</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" class="input-field" id="chat-input" placeholder="Änderung beschreiben..." style="margin-bottom:0;">
      <button class="btn" style="padding:10px 20px;" onclick="sendChat()">SENDEN</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('matrix-bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);
function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0f0';
  ctx.font = fontSize + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 33);

const API_URL = 'http://localhost:8000/api/v1';
let currentQuestion = null;
let answers = {};
let questionCount = 0;
const MAX_QUESTIONS = 12;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function startBlueprint() {
  answers = {};
  questionCount = 0;
  await fetchNextQuestion();
  showScreen('question-screen');
}

async function fetchNextQuestion() {
  // First question is always the app description
  if (questionCount === 0) {
    currentQuestion = {
      id: 'app_description',
      q: 'Was soll deine App machen? Beschreibe in eigenen Worten.',
      hint: 'z.B. "Ein Dienstplan für die Bundeswehr" oder "Ein Tool um Aufgaben im Team zu verwalten"',
      type: 'text'
    };
  }
  showQuestion();
}

function showQuestion() {
  document.getElementById('question-text').textContent = currentQuestion.q;
  document.getElementById('question-hint').textContent = currentQuestion.hint;
  document.getElementById('progress').style.width = (questionCount / MAX_QUESTIONS * 100) + '%';
  document.getElementById('answer-input').value = '';
  document.getElementById('ai-research').classList.remove('active');
  document.getElementById('next-btn').disabled = true;
  document.getElementById('next-btn').onclick = submitAnswer;

  const container = document.getElementById('options-container');
  container.innerHTML = '';
  if (currentQuestion.options) {
    currentQuestion.options.forEach(opt => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = '<div class="label">' + opt[0] + '</div><div class="desc">' + opt[2] + '</div>';
      div.onclick = () => selectOption(opt[1], div);
      container.appendChild(div);
    });
  }
}

function selectOption(value, el) {
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('answer-input').value = value;
  document.getElementById('next-btn').disabled = false;
}

document.getElementById('answer-input').addEventListener('input', function() {
  if (this.value.trim()) {
    document.getElementById('next-btn').disabled = false;
  }
});

async function submitAnswer() {
  const answer = document.getElementById('answer-input').value.trim();
  if (!answer) return;
  
  answers[currentQuestion.id] = answer;
  questionCount++;
  
  // Show AI research
  const researchDiv = document.getElementById('ai-research');
  const researchContent = document.getElementById('research-content');
  researchDiv.classList.add('active');
  researchContent.innerHTML = '<span class="ai-analyzing">🔍 KI recherchiert: ' + answer + '...</span>';
  document.getElementById('next-btn').disabled = true;
  
  try {
    const resp = await fetch(API_URL + '/blueprint/research?question_id=' + encodeURIComponent(currentQuestion.id) + '&answer=' + encodeURIComponent(answer), {method: 'POST'});
    const data = await resp.json();
    
    let html = '<div class="research-item">📊 ' + data.research + '</div>';
    if (data.sources && data.sources.length > 0) {
      html += '<div class="research-item">🔗 Quellen: ' + data.sources.join(', ') + '</div>';
    }
    if (data.follow_up_questions && data.follow_up_questions.length > 0) {
      html += '<div class="research-item" style="margin-top:10px; color:#0f0;">❓ Folgefragen generiert:</div>';
      data.follow_up_questions.forEach(fq => {
        html += '<div class="research-item" style="margin-left:20px;">• ' + fq.q + '</div>';
      });
    }
    html += '<div class="research-item" style="margin-top:10px;">✅ Wird in Blueprint und App-Erstellung einfließen.</div>';
    researchContent.innerHTML = html;
    
    // Set up next question from follow-ups
    if (data.follow_up_questions && data.follow_up_questions.length > 0 && questionCount < MAX_QUESTIONS) {
      // Use first follow-up as next question
      const nextQ = data.follow_up_questions[0];
      currentQuestion = {
        id: nextQ.id || ('q_' + questionCount),
        q: nextQ.q,
        hint: nextQ.hint || '',
        type: nextQ.type || 'text',
        options: nextQ.options || null
      };
      document.getElementById('next-btn').disabled = false;
      document.getElementById('next-btn').onclick = function() {
        researchDiv.classList.remove('active');
        showQuestion();
      };
    } else {
      // No more follow-ups or max reached
      document.getElementById('next-btn').disabled = false;
      document.getElementById('next-btn').onclick = function() {
        researchDiv.classList.remove('active');
        startLoading();
      };
      document.getElementById('next-btn').textContent = 'FERTIG';
    }
  } catch (err) {
    researchContent.innerHTML = '<div class="research-item">📊 Antwort gespeichert: ' + answer + '</div>' +
      '<div class="research-item">⚠️ Backend nicht erreichbar, verwende lokale Analyse.</div>' +
      '<div class="research-item">✅ Wird in Blueprint und App-Erstellung einfließen.</div>';
    document.getElementById('next-btn').disabled = false;
    document.getElementById('next-btn').onclick = function() {
      researchDiv.classList.remove('active');
      if (questionCount < MAX_QUESTIONS) {
        fetchNextQuestion();
      } else {
        startLoading();
      }
    };
  }
}

function startLoading() {
  showScreen('loading-screen');
  const steps = [
    "Blueprint wird erstellt...",
    "KI analysiert alle Antworten...",
    "Datenmodell wird generiert...",
    "API-Endpunkte werden definiert...",
    "Authentifizierung wird konfiguriert...",
    "Frontend wird vorbereitet...",
    "Integrationen werden eingerichtet...",
    "Nicht-funktionale Anforderungen werden gesetzt...",
    "Blueprint wird validiert...",
    "App wird kompiliert...",
    "APK wird generiert..."
  ];
  let i = 0;
  const interval = setInterval(() => {
    if (i < steps.length) {
      document.getElementById('loading-text').textContent = steps[i];
      document.getElementById('loading-progress').style.width = ((i+1)/steps.length*100) + '%';
      i++;
    } else {
      clearInterval(interval);
      showProjects();
    }
  }, 800);
}

function showProjects() {
  showScreen('projects-screen');
  const projectName = answers.app_description || 'Meine App';
  const list = document.getElementById('projects-list');
  list.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'project-card';
  card.innerHTML = `
    <h3>${projectName}</h3>
    <p>Erstellt aus ${Object.keys(answers).length} Blueprint-Antworten</p>
    <p style="color:#0f0;">Status: Fertig</p>
    <a href="#" class="download-btn" download>APK HERUNTERLADEN</a>
    <button class="chat-btn" onclick="openChat('${projectName}')">AI CHAT</button>
  `;
  list.appendChild(card);
}

function restart() {
  currentQuestion = null;
  answers = {};
  questionCount = 0;
  showScreen('start-screen');
}

let currentChatProject = '';
function openChat(projectName) {
  currentChatProject = projectName;
  document.getElementById('chat-project-name').textContent = projectName;
  document.getElementById('chat-overlay').classList.add('active');
  document.getElementById('chat-messages').innerHTML = '<div class="chat-msg ai">Hallo! Ich bin dein AI-Assistent. Sag mir was du an "' + projectName + '" ändern möchtest.</div>';
}
function closeChat() {
  document.getElementById('chat-overlay').classList.remove('active');
}
function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML += '<div class="chat-msg user">' + msg + '</div>';
  input.value = '';
  setTimeout(() => {
    msgs.innerHTML += '<div class="chat-msg ai">Verstanden! Ich werde "' + msg + '" umsetzen. Die App wird neu generiert.</div>';
    msgs.scrollTop = msgs.scrollHeight;
  }, 1000);
  msgs.scrollTop = msgs.scrollHeight;
}
document.getElementById('chat-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendChat();
});
</script>
</body>
</html>

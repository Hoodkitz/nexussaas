[project]
name = "nexussaas"
version = "0.2.0"
description = "NexusSaaS - AI-agent orchestration SaaS platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["matrix-app", "var"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
